name: Temporary performance source artifact
on:
  pull_request:
    branches: [main]
jobs:
  artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: performance-main-window-fix
          path: chatgpt_staging_20260919/performance_main_window.py
          retention-days: 1
          if-no-files-found: error
